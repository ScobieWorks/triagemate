[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triagemate"
version = "0.1.0"
description = "Lightweight GitHub issue triage automation."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ScobieWorks"}
]
dependencies = []

[project.scripts]
triagemate = "triagemate.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["triagemate*"]
